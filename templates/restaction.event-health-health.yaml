apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: event-health-health
  namespace: krateo-system
spec:
  api:
    - headers:
        - 'Accept: application/json'
      name: sites
      path: /apis/composition.krateo.io/v0-1-0/namespaces/demo-system/eventsites
      verb: GET
  filter: |
    { sites: [ .sites.items[]? | (
        (if any(.status.conditions[]?; .type == "Ready" and .status == "True") then "Ready"
         elif any(.status.conditions[]?; .status == "False") then "Failing"
         else "Progressing" end) as $h |
        [ { kind: "jsonSchemaType", type: "string", valueKey: "name",      stringValue: .metadata.name },
          { kind: "jsonSchemaType", type: "string", valueKey: "namespace", stringValue: .metadata.namespace },
          { kind: "jsonSchemaType", type: "string", valueKey: "image",     stringValue: (.spec.image // "—") },
          { kind: "jsonSchemaType", type: "string", valueKey: "replicas",  stringValue: ((.status.readyReplicas // 0) | tostring) },
          { kind: "jsonSchemaType", type: "string", valueKey: "form",      stringValue: (.status.formUrl // "—") },
          { kind: "tag",    valueKey: "health",    stringValue: $h,
            color: (if $h == "Ready" then "green" elif $h == "Failing" then "red" else "blue" end) } ]
      ) ],
      byHealth: [ .sites.items[]? | (if any(.status.conditions[]?; .type == "Ready" and .status == "True") then "Ready"
                 elif any(.status.conditions[]?; .status == "False") then "Failing"
                 else "Progressing" end) ] | group_by(.) | map({ health: .[0], count: length }) }
